name: Publish release from URL

on:
  push:
    paths:
      - "trigger-publish.json"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.8.3)
        required: true
        type: string
      apk_url:
        description: Temporary public APK URL to download
        required: true
        type: string
      notes:
        description: Release notes
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve inputs
        id: meta
        run: |
          set -euo pipefail
          if [ -f trigger-publish.json ]; then
            TAG=$(python3 -c 'import json; print(json.load(open("trigger-publish.json")).get("tag") or "")')
            APK_URL=$(python3 -c 'import json; print(json.load(open("trigger-publish.json")).get("apk_url") or "")')
            NOTES=$(python3 -c 'import json; print(json.load(open("trigger-publish.json")).get("notes") or "")')
          else
            TAG="${{ inputs.tag }}"
            APK_URL="${{ inputs.apk_url }}"
            NOTES="${{ inputs.notes }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$TAG" ] || [ -z "$APK_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download APK and create release
        if: steps.meta.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          NOTES: ${{ steps.meta.outputs.notes }}
          APK_URL: ${{ steps.meta.outputs.apk_url }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o JBidAlerts.apk "$APK_URL"
          ls -la JBidAlerts.apk
          python3 - <<'PY'
          import json, os, pathlib, re
          tag = os.environ["TAG"]
          notes = os.environ.get("NOTES") or ""
          # Prefer committed update.json when present and matching this tag.
          update_path = pathlib.Path("update.json")
          data = {}
          if update_path.exists():
              try:
                  data = json.loads(update_path.read_text())
              except Exception:
                  data = {}
          version_name = str(data.get("versionName") or "").strip()
          if not version_name:
              version_name = tag[1:] if tag.startswith("v") else tag
          version_code = data.get("versionCode")
          if not isinstance(version_code, int):
              # Derive a simple code from semver like 1.8.3 -> 183-ish fallback
              parts = [int(p) for p in re.findall(r"\d+", version_name)[:3]]
              while len(parts) < 3:
                  parts.append(0)
              version_code = parts[0] * 100 + parts[1] * 10 + parts[2]
          data = {
              "versionCode": version_code,
              "versionName": version_name,
              "apkUrl": f"https://github.com/CloudsVex/jbid-alerts-dist/releases/download/{tag}/JBidAlerts.apk",
              "notes": notes or data.get("notes") or f"JBidAlerts {version_name}",
          }
          update_path.write_text(json.dumps(data, indent=2) + "\n")
          print(data)
          PY
          if gh release view "$TAG" --repo CloudsVex/jbid-alerts-dist >/dev/null 2>&1; then
            gh release upload "$TAG" update.json JBidAlerts.apk --clobber --repo CloudsVex/jbid-alerts-dist
          else
            gh release create "$TAG" update.json JBidAlerts.apk \
              --repo CloudsVex/jbid-alerts-dist \
              --title "$TAG" \
              --notes "$NOTES"
          fi
