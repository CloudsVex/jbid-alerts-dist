name: Publish release from URL

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.8)
        required: true
        type: string
      apk_url:
        description: Temporary public APK URL to download
        required: true
        type: string
      notes:
        description: Release notes
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download APK and create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
          APK_URL: ${{ inputs.apk_url }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o JBidAlerts.apk "$APK_URL"
          ls -la JBidAlerts.apk
          python3 - <<'PY'
          import json, os, pathlib
          tag = os.environ["TAG"]
          data = json.loads(pathlib.Path("update.json").read_text())
          data["versionCode"] = 9
          data["versionName"] = "1.8"
          data["apkUrl"] = f"https://github.com/CloudsVex/jbid-alerts-dist/releases/download/{tag}/JBidAlerts.apk"
          data["notes"] = "Settings: auto reminder for new wishlist items with selectable lead time (5/10/15/20/30 min)."
          pathlib.Path("update.json").write_text(json.dumps(data, indent=2) + "\n")
          print(data)
          PY
          if gh release view "$TAG" --repo CloudsVex/jbid-alerts-dist >/dev/null 2>&1; then
            gh release upload "$TAG" update.json JBidAlerts.apk --clobber --repo CloudsVex/jbid-alerts-dist
          else
            gh release create "$TAG" update.json JBidAlerts.apk \
              --repo CloudsVex/jbid-alerts-dist \
              --title "$TAG" \
              --notes "$NOTES"
          fi
