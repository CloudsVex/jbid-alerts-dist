name: Publish release from URL

on:
  push:
    paths:
      - "trigger-publish.json"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.8)
        required: true
        type: string
      apk_url:
        description: Temporary public APK URL to download
        required: true
        type: string
      notes:
        description: Release notes
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve inputs
        id: meta
        run: |
          set -euo pipefail
          if [ -f trigger-publish.json ]; then
            TAG=$(python3 -c 'import json; print(json.load(open("trigger-publish.json"))["tag"])')
            APK_URL=$(python3 -c 'import json; print(json.load(open("trigger-publish.json"))["apk_url"])')
            NOTES=$(python3 -c 'import json; print(json.load(open("trigger-publish.json")).get("notes",""))')
          else
            TAG="${{ inputs.tag }}"
            APK_URL="${{ inputs.apk_url }}"
            NOTES="${{ inputs.notes }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"
      - name: Download APK and create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          NOTES: ${{ steps.meta.outputs.notes }}
          APK_URL: ${{ steps.meta.outputs.apk_url }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o JBidAlerts.apk "$APK_URL"
          ls -la JBidAlerts.apk
          python3 - <<'PY'
          import json, os, pathlib
          tag = os.environ["TAG"]
          data = {
            "versionCode": 9,
            "versionName": "1.8",
            "apkUrl": f"https://github.com/CloudsVex/jbid-alerts-dist/releases/download/{tag}/JBidAlerts.apk",
            "notes": "Settings: auto reminder for new wishlist items with selectable lead time (5/10/15/20/30 min).",
          }
          pathlib.Path("update.json").write_text(json.dumps(data, indent=2) + "\n")
          print(data)
          PY
          if gh release view "$TAG" --repo CloudsVex/jbid-alerts-dist >/dev/null 2>&1; then
            gh release upload "$TAG" update.json JBidAlerts.apk --clobber --repo CloudsVex/jbid-alerts-dist
          else
            gh release create "$TAG" update.json JBidAlerts.apk \
              --repo CloudsVex/jbid-alerts-dist \
              --title "$TAG" \
              --notes "$NOTES"
          fi
